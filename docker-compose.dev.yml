version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: booknest_dev_mysql
    environment:
      MYSQL_ROOT_PASSWORD: dev_password
      MYSQL_DATABASE: booknest_chatgpt_ag
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql

volumes:
  mysql_dev_data:
