name: QUIRO CI/CD Pipeline

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: quiro
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: cd server && npm ci

      - name: Initialize Database Schema
        run: cd server && npm run db:init
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: quiro

      - name: Run Database Migrations
        run: cd server && npm run db:migrate
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: quiro

      - name: Seed Database Fixtures
        run: cd server && npm run db:seed
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: quiro

      - name: Execute Automated Test Runner (Smoke, Brand, Regression, Payments & Swaps)
        run: cd server && npm test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: quiro
          JWT_SECRET: ci_test_jwt_secret_minimum_32_characters
          NODE_ENV: test

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Verify Client Production Build
        run: cd client && npm run build
