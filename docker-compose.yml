version: '3.8'

# ---------------------------------------------------------------------------
# QUIRO Shared Base Docker Compose
#
# This file defines the service structure. It does NOT enforce production
# secrets. Use an override file for environment-specific configuration:
#
#   Local development (bundled MySQL):
#     docker-compose -f docker-compose.yml -f docker-compose.local.yml \
#       --profile local-db up -d
#
#   Production (TiDB Cloud — mandatory secrets enforced):
#     docker-compose -f docker-compose.yml -f docker-compose.production.yml \
#       --env-file .env.production up -d backend frontend
#
# Do NOT put real credentials here or in any source-controlled file.
# ---------------------------------------------------------------------------

services:
  # -------------------------------------------------------------------------
  # Optional local MySQL container.
  # Activated only when --profile local-db is explicitly passed.
  # Production deployments use TiDB Cloud; this service must NOT start there.
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: quiro_mysql
    profiles: ["local-db"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dev_root_password}
      MYSQL_DATABASE: ${DB_NAME:-quiro}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Backend — Express / Node.js
  # Variables use safe empty defaults here. Override files supply real values.
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quiro_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000

      # Database — overridden per environment via override files.
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-quiro}
      DB_SSL: ${DB_SSL:-false}
      DB_CA_PATH: ${DB_CA_PATH:-}

      # Security
      JWT_SECRET: ${JWT_SECRET:-}

      # Application
      CLIENT_URL: ${CLIENT_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-warn}

      # Payment gateway — optional in base; enforced in production override.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

      # Google OAuth (backend)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Optional AI features
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}

      # Optional Cloudinary media storage
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      # Swap / shipping
      SWAP_SHIPPING_FEE: ${SWAP_SHIPPING_FEE:-79.00}

    ports:
      - "5000:5000"
    depends_on: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # Frontend — React SPA served via Nginx
  # VITE_API_URL is baked in at image build time, not at runtime.
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: quiro_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
