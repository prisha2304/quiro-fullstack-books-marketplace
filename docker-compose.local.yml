# ---------------------------------------------------------------------------
# QUIRO Local Development Docker Compose Override
#
# USAGE:
#   docker-compose -f docker-compose.yml -f docker-compose.local.yml \
#     --profile local-db up -d
#
# This file overrides the base Compose for local development:
#   - Provides local MySQL connection settings and non-secret dev defaults.
#   - Reconnects the backend to the bundled mysql service with depends_on.
#   - Razorpay credentials are local test-mode placeholders only.
#   - Works without any production secrets pre-exported.
# ---------------------------------------------------------------------------

services:
  backend:
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_SSL: "false"
      DB_CA_PATH: ""
      DB_USER: root
      DB_PASSWORD: dev_root_password
      DB_NAME: quiro
      JWT_SECRET: local_dev_jwt_secret_min_32_chars_ok
      CLIENT_URL: http://localhost
      # Razorpay test-mode placeholders (no real money, capture blocked in prod)
      RAZORPAY_KEY_ID: rzp_test_local_placeholder
      RAZORPAY_KEY_SECRET: local_razorpay_secret_placeholder_32ch
      RAZORPAY_WEBHOOK_SECRET: local_webhook_secret_placeholder_32ch
    depends_on:
      mysql:
        condition: service_healthy
